services:
  postgres:
    image: postgres:16-alpine
    container_name: singular-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: singular
      POSTGRES_PASSWORD: singular
      POSTGRES_DB: singular
    ports:
      - "5432:5432"
    volumes:
      - singular_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singular -d singular"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: singular-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - singular_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  singular_pg_data:
  singular_redis_data:
